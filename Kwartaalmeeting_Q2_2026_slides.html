<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kwartaalmeeting · Q1 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#F4F1E8; --paper-2:#EBE5D7; --card:#FBF9F3;
  --ink:#15120C; --muted:#6B6453;
  --gold:#D99C1C; --gold-deep:#B47F12;
  --green:#1F7A4D; --red:#C13A22;
  --line:rgba(21,18,12,.12);
  --rev:#161109; --rev-2:#211A0F;
  --shadow:0 24px 60px -28px rgba(21,18,12,.45);
  --maxw:100%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',Georgia,serif}
.tab{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--green)} .dn{color:var(--red)}

#deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(26px,5vh,60px) clamp(28px,6vw,92px);opacity:0;visibility:hidden;transform:scale(.992);transition:opacity .5s ease,transform .5s ease,visibility .5s}
.slide.is-active{opacity:1;visibility:visible;transform:none;z-index:2}
.slide__inner{width:100%;max-width:var(--maxw);margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.eyebrow{font-size:.76rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.stripe{display:flex;height:6px;width:120px;border-radius:6px;overflow:hidden}
.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--gold)} .stripe i:nth-child(2){background:var(--green)}
.stripe i:nth-child(3){background:var(--red)} .stripe i:nth-child(4){background:repeating-linear-gradient(45deg,#bbb 0 4px,#fff 4px 8px)}

/* chrome */
.chrome{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);pointer-events:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chrome .dots{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;max-width:60%;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);border:0;cursor:pointer;transition:.3s;padding:0}
.dot.on{background:var(--ink);transform:scale(1.3)}
.brandmark{font-weight:800;letter-spacing:.05em}
.hint{position:fixed;z-index:50;top:18px;right:clamp(20px,5vw,40px);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7}
.darkchrome .chrome,.darkchrome .hint{color:#9a917f}
.darkchrome .dot{background:rgba(255,255,255,.18)} .darkchrome .dot.on{background:var(--gold)}

/* avatars */
.av{border-radius:50%;object-fit:cover;background:var(--paper-2);display:block}
.av-ring{border-radius:50%;padding:3px;display:inline-flex;background:var(--mc,#999)}
.av-ring .av{border:3px solid var(--paper)}
.darkchrome .av-ring .av,.reveal .av-ring .av,.act .av-ring .av{border-color:var(--rev)}

.reveal-up{opacity:0;transform:translateY(24px)}
.is-active .reveal-up{animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
.is-active .d1{animation-delay:.05s}.is-active .d2{animation-delay:.15s}.is-active .d3{animation-delay:.28s}
.is-active .d4{animation-delay:.42s}.is-active .d5{animation-delay:.55s}
@keyframes up{to{opacity:1;transform:none}}

/* ---- COVER ---- */
.cover h1{font-weight:900;line-height:.92;letter-spacing:-.02em;font-size:clamp(3.2rem,9.5vw,8rem)}
.cover h1 em{font-style:italic;color:var(--gold-deep)}
.cover .sub{margin-top:18px;font-size:clamp(1rem,2.3vw,1.6rem);color:var(--muted);font-weight:500}
.cover .scoreboard{margin-top:46px;display:flex;border-top:2px solid var(--ink);padding-top:18px}
.cover .sb{flex:1;padding-right:24px;border-right:1px solid var(--line)}
.cover .sb:last-child{border-right:0}
.cover .sb b{display:block;font-size:clamp(1.5rem,3.6vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.cover .sb span{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---- ACT DIVIDER ---- */
.act{background:var(--rev);color:var(--paper)}
.act .romnum{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(6rem,22vw,18rem);line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(244,241,232,.28);letter-spacing:-.02em}
.act .row{display:flex;align-items:flex-end;gap:clamp(20px,5vw,56px);flex-wrap:wrap}
.act h2{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2.4rem,6.5vw,5rem);line-height:.96;letter-spacing:-.02em}
.act h2 .u{display:inline-block;border-bottom:6px solid var(--gold);padding-bottom:.06em}
.act .lede{margin-top:20px;max-width:46ch;color:#cfc6b2;font-size:clamp(1rem,1.9vw,1.3rem);line-height:1.5}
.act .toc{margin-top:28px;display:flex;flex-direction:column;gap:9px}
.act .toc div{display:flex;gap:14px;align-items:baseline;color:#9b937f;font-size:.95rem}
.act .toc .now{color:var(--paper);font-weight:700}
.act .toc b{font-variant-numeric:tabular-nums;color:var(--gold);min-width:1.8em}

/* ---- generic heads ---- */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
.head h3{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.9rem,4.2vw,3.2rem);letter-spacing:-.01em;line-height:1.02}
.head .meta{text-align:right;color:var(--muted);font-size:.85rem}
.head .meta b{display:block;font-size:1.5rem;font-weight:800}

/* ---- EVENTS ---- */
.events{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;flex:1;min-height:0}
.evt{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ec,var(--gold));border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;opacity:0;transform:translateY(20px)}
.is-active .evt{animation:up .6s cubic-bezier(.2,.7,.2,1) forwards}
.evt .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.evt .per{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.evt .ico{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--ec,var(--gold));font-weight:900}
.evt h4{font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;margin-bottom:6px;line-height:1.05}
.evt p{font-size:.92rem;color:#3f3a30;line-height:1.45}
.evt .det{font-size:.84rem;color:var(--muted);font-style:italic;margin-top:7px;line-height:1.4}
.evt .stat{margin-top:auto;padding-top:10px;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem;color:var(--ec,var(--gold))}

/* ---- SCOREBOARD ---- */
.board{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,52px);flex:1;min-height:0;align-items:center}
.idx{display:flex;flex-direction:column;gap:0}
.idxrow{display:grid;grid-template-columns:1fr auto;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.idxrow .nm{font-weight:600;font-size:1.05rem}
.idxrow .v{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem}
.act-tx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px}
.act-tx h4{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.act-tx .big{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2.6rem,6vw,4rem);line-height:1}
.act-tx .big span{font-size:1rem;color:var(--muted);font-family:'Archivo'}
.txsplit{display:flex;gap:24px;margin-top:18px}
.txsplit div b{display:block;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.txsplit div span{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---- GROUP VS MARKET (Act II) ---- */
.gvm{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.gvm .bars{display:flex;flex-direction:column;gap:14px;margin:8px 0}
.brow{display:grid;grid-template-columns:130px 1fr 84px;align-items:center;gap:16px}
.brow .lab{font-weight:600;font-size:1rem;text-align:right}
.brow.us .lab{font-weight:800;color:var(--gold-deep)}
.btrack{position:relative;height:30px;background:linear-gradient(90deg,transparent,rgba(21,18,12,.04));border-radius:6px}
.bzero{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);opacity:.25}
.bfill{position:absolute;top:0;bottom:0;border-radius:5px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.brow .bv{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;text-align:left}
.gvm .verdict{margin-top:26px;display:flex;align-items:baseline;gap:18px;border-top:2px solid var(--ink);padding-top:20px}
.gvm .verdict .num{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(3rem,8vw,5.5rem);line-height:.9;color:var(--gold-deep)}
.gvm .verdict .txt{font-size:clamp(1.05rem,2.2vw,1.5rem);max-width:24ch;line-height:1.25}
.gvm .seal{margin-top:8px;font-size:.85rem;color:var(--muted);font-style:italic}

/* ---- REVEAL ---- */
.reveal{background:var(--rev);color:var(--paper);overflow:hidden}
.reveal .slide__inner{justify-content:center;text-align:center;align-items:center}
.reveal .jersey{font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:var(--jc,var(--gold));font-weight:700;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.reveal .jdot{width:11px;height:11px;border-radius:50%;background:var(--jc,var(--gold));box-shadow:0 0 0 4px rgba(217,156,28,.22)}
.reveal .crit{font-family:'Fraunces',serif;font-style:italic;color:#cfc6b2;font-size:clamp(1rem,2.3vw,1.5rem);margin-top:10px;max-width:34ch}
.reveal .stage{position:relative;margin-top:30px;min-height:330px;width:100%;display:flex;align-items:center;justify-content:center}
.cover-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s,transform .6s}
.cover-card .q{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(4.5rem,15vw,10rem);color:transparent;-webkit-text-stroke:2px var(--jc,rgba(217,156,28,.55));line-height:1;opacity:.6}
.cover-card .press{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#8c8470;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.reveal.revealed .cover-card{opacity:0;transform:scale(1.15);pointer-events:none}
.winner{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateY(20px) scale(.96)}
.reveal.revealed .winner{animation:win .8s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes win{to{opacity:1;transform:none}}
.winner .halo{position:relative}
.winner .halo::after{content:"";position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(217,156,28,.45)),transparent 70%);z-index:-1;opacity:0}
.reveal.revealed .winner .halo::after{animation:halo .9s ease .3s forwards}
@keyframes halo{to{opacity:1}}
.winner .av-ring{--mc:var(--jc,var(--gold));box-shadow:0 20px 50px -10px var(--glow,rgba(217,156,28,.5))}
.winner .nm{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2.2rem,5.5vw,4rem);letter-spacing:-.01em;margin-top:12px}
.winner .ticker{font-size:.88rem;letter-spacing:.2em;text-transform:uppercase;color:#cfc6b2;font-weight:600}
.winner .stat{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(2.8rem,8vw,5.6rem);color:var(--jc,var(--gold));line-height:1;margin-top:8px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cf{position:absolute;top:-12px;width:9px;height:14px;opacity:0}
.reveal.revealed .cf{animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(560px) rotate(540deg)}}

/* ---- SEASON STANDINGS ---- */
.season .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);flex:1;min-height:0}
.scol{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;display:flex;flex-direction:column}
.scol .badge{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.scol .badge .sw{width:16px;height:34px;border-radius:5px}
.scol .badge .t{font-family:'Fraunces',serif;font-weight:700;font-size:1.5rem}
.scol .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.scol .note{margin-top:auto;padding-top:14px;font-size:.78rem;color:var(--muted);font-style:italic;border-top:1px solid var(--line)}
.srow2{display:grid;grid-template-columns:24px 30px 1fr auto;gap:11px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.srow2:last-of-type{border-bottom:0}
.srow2 .pos{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);text-align:right}
.srow2 .nm{font-weight:600}
.srow2 .pts{font-variant-numeric:tabular-nums;font-weight:800}
.srow2.lead{background:linear-gradient(90deg,rgba(217,156,28,.12),transparent)}
.srow2 .extra{font-size:.78rem;color:var(--muted)}

/* ---- RANKING CLIMAX ---- */
.rank .grid{display:grid;grid-template-columns:.92fr 1.4fr;gap:clamp(24px,4vw,52px);flex:1;min-height:0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-bottom:8px}
.pod{display:flex;flex-direction:column;align-items:center;gap:9px;flex:1}
.pod .nm{font-weight:700;font-size:.95rem}
.pod .rp{font-weight:800;font-size:1.05rem}
.pod .block{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:'Fraunces',serif;font-weight:900;font-size:1.4rem;color:var(--muted);transform-origin:bottom;transform:scaleY(0);background:linear-gradient(180deg,var(--paper-2),#dcd4c2)}
.is-active .pod .block{animation:grow .7s cubic-bezier(.2,.8,.2,1) forwards}
.pod1 .block{height:148px;background:linear-gradient(180deg,#F2D98C,var(--gold))}
.pod2 .block{height:106px}.pod3 .block{height:78px}
.is-active .pod1 .block{animation-delay:.5s}.is-active .pod2 .block{animation-delay:.25s}.is-active .pod3 .block{animation-delay:.1s}
@keyframes grow{to{transform:scaleY(1)}}
.pod1 .av-ring{transform:scale(1.12)}
.stand{display:flex;flex-direction:column;align-self:center;width:100%}
.srow{display:grid;grid-template-columns:24px 32px 1fr 1fr auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateX(16px)}
.is-active .srow{animation:slidein .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes slidein{to{opacity:1;transform:none}}
.srow .pos{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);text-align:right}
.srow .nm{font-weight:600}
.srow .bar{height:8px;border-radius:4px;width:0;transition:width .6s ease;justify-self:stretch;align-self:center}
.srow .val{font-variant-numeric:tabular-nums;font-weight:800;min-width:5.2em;text-align:right}
.srow.lead{background:linear-gradient(90deg,rgba(217,156,28,.12),transparent);border-bottom-color:var(--gold)}
.benchline{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- KAMELENRACE ---- */
.race .wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.race svg{width:100%;flex:1;min-height:0}
.race .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.race .lg{display:flex;align-items:center;gap:6px;font-size:.82rem}
.race .lg i{width:14px;height:3px;border-radius:2px}

/* ---- STOCKS ---- */
.stocks .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);flex:1;min-height:0}
.stocks h4{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.strow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.strow .s{font-weight:700}
.strow .m{font-size:.8rem;color:var(--muted)}
.strow .v{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem}

/* ---- LIFETIME BAR ---- */
.life .chart{flex:1;min-height:0;display:flex;align-items:flex-end;gap:clamp(6px,1.4vw,16px);padding-top:30px;border-bottom:2px solid var(--ink)}
.lbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.lbar .col{width:62%;max-width:48px;border-radius:6px 6px 0 0;background:var(--mc,#999);transform-origin:bottom;transform:scaleY(0)}
.is-active .lbar .col{animation:grow .7s cubic-bezier(.2,.8,.2,1) forwards}
.lbar .v{font-variant-numeric:tabular-nums;font-weight:800;font-size:.82rem;margin-bottom:6px}
.lbar .nm{margin-top:8px;font-size:.78rem;color:var(--muted)}

/* ---- MEMBER (one-pager) ---- */
.member .slide__inner{justify-content:flex-start;gap:14px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mhead .who{display:flex;align-items:flex-start;gap:14px}
.mhead h2{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.6rem,2.9vw,2.3rem);line-height:1}
.mhead .role{color:var(--muted);font-size:.8rem;margin-top:2px}
.mhead .jrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.jpill{display:flex;gap:6px;align-items:center;font-weight:600;font-size:.74rem;border-radius:999px;padding:4px 11px}
.jpill.now{color:#fff}
.jpill .sw{width:10px;height:10px;border-radius:50%;flex:none}
.jpill.palm{background:var(--card);border:1px solid var(--line);color:var(--muted)}
.jpill.palm b{color:var(--ink);font-variant-numeric:tabular-nums}
.mranks{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.badge-lt{background:linear-gradient(180deg,#F2D98C,var(--gold));color:#3a2a06;font-weight:800;font-size:.82rem;border-radius:999px;padding:5px 14px}
.badge-q{font-size:.74rem;color:var(--muted);font-weight:600}
.member .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.kpi .lab{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(1.25rem,2.3vw,1.75rem);line-height:1;margin-top:5px}
.kpi .rk{font-size:.7rem;color:var(--muted);margin-top:4px}
.mgrid{display:grid;grid-template-columns:1.32fr 1fr;gap:18px;flex:1;min-height:0}
.rightcol{display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;min-height:0}
.panel h4{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.panel h4 span{font-size:.62rem;color:var(--muted);font-weight:400}
.pospanel{flex:1}
.pos{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:4.5px 0;border-bottom:1px solid var(--line)}
.pos:last-of-type{border-bottom:0}
.pos .nm{font-weight:600;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos .w{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;min-width:2.6em;text-align:right}
.pos .r{font-variant-numeric:tabular-nums;font-weight:800;font-size:.86rem;min-width:4.2em;text-align:right}
.posmore{font-size:.74rem;color:var(--muted);padding-top:8px;font-style:italic}

/* ===== audio (Web Audio synth) ===== */
let _ac=null,_audioOn=true;
function ac(){try{if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();}catch(e){}return _ac;}
function _beep(freq,t0,dur,type,vol){const c=ac();if(!c||!_audioOn)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol||0.2,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur+0.05);}
function _noise(t,dur,type,freq,vol,decay){const c=ac();if(!c||!_audioOn)return;const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(decay?Math.pow(1-i/n,1.4):1);const src=c.createBufferSource();src.buffer=buf;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;src.connect(f).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+0.02);}
function sfxFanfare(){const c=ac();if(!c||!_audioOn)return;const t=c.currentTime;[523.25,659.25,783.99].forEach((f,i)=>_beep(f,t+i*0.12,0.28,'triangle',0.22));_beep(1046.5,t+0.42,0.7,'triangle',0.3);_beep(783.99,t+0.42,0.7,'triangle',0.18);}
function sfxCymbal(t){_noise(t,0.7,'highpass',6000,0.22,true);}
function sfxDrumroll(dur){const c=ac();if(!c||!_audioOn)return;const t0=c.currentTime;dur=dur||2.4;let t=t0,gap=0.10;while(t<t0+dur){const v=0.04+0.18*((t-t0)/dur);_noise(t,0.05,'bandpass',190,v,true);t+=gap;gap=Math.max(0.022,gap*0.9);}sfxCymbal(t0+dur);}
function sfxCheer(){_noise(ac()?ac().currentTime:0,1.3,'bandpass',1100,0.16,false);}
function playSong(){const a=document.getElementById('camelSong');if(!a||!_audioOn)return;if(a.paused){a.play().catch(()=>{});}}
function toggleAudio(){_audioOn=!_audioOn;const b=document.getElementById('audioBtn');if(b)b.textContent=_audioOn?'♪ geluid aan':'♪ geluid uit';const a=document.getElementById('camelSong');if(a){if(!_audioOn){a.pause();}else{ac();if(a.currentTime>0&&!a.ended)a.play().catch(()=>{});}}else if(_audioOn)ac();}

let _raceStep=0,_raceAnimFrame=null,_raceChart=null,_raceImgs={},_raceSpec=null,_raceSpeed=0.1,_raceView='etappe';
function preloadRacePhotos(){(DATA.meta.active||[]).forEach(n=>{if(_raceImgs[n])return;const im=new Image();im.src=DATA.photos[n]||'';im.onload=()=>{if(_raceChart)_raceChart.render();};_raceImgs[n]=im;});}
function _animateTo(from,to,ms){if(_raceAnimFrame){cancelAnimationFrame(_raceAnimFrame);_raceAnimFrame=null;}let start=null;
  function tick(ts){if(!start)start=ts;const t=Math.min((ts-start)/ms,1);const e=t<0.5?2*t*t:-1+(4-2*t)*t;_raceStep=from+(to-from)*e;if(_raceChart)_raceChart.render();if(t<1){_raceAnimFrame=requestAnimationFrame(tick);}else{_raceStep=to;if(_raceChart)_raceChart.render();_raceAnimFrame=null;}}
  _raceAnimFrame=requestAnimationFrame(tick);}
function replayRace(){if(!_raceChart||!_raceSpec)return;const n=_raceSpec.labels.length-1;_raceStep=0;_raceChart.render();if(n>0)_animateTo(0,n,(n*620)/_raceSpeed);}
function setRaceSpeed(v){_raceSpeed=parseFloat(v)||1;var l=document.getElementById('rc-speed-lbl');if(l)l.textContent=(Number.isInteger(_raceSpeed)?_raceSpeed:_raceSpeed.toFixed(1))+'\u00d7';}
function setRaceView(v){if(!DATA.race||!DATA.race[v])return;_raceView=v;document.querySelectorAll('.rc-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));var ti=document.getElementById('race-title');if(ti)ti.textContent={etappe:'De race om de etappe — wie pakt '+DATA.meta.quarter+'?',ytd:'De YTD-race — stand na '+DATA.meta.quarter,alltime:'De hele rit — lifetime rendement'}[v];var sp=DATA.race[v];buildRaceChart({id:'race-chart',labels:sp.labels,members:sp.members});replayRace();}
function buildRaceChart(s){
  const el=document.getElementById(s.id);if(!el||!window.Chart)return;if(_raceChart){_raceChart.destroy();_raceChart=null;}_raceSpec=s;
  const datasets=s.members.map(m=>({label:m.name,data:m.data,borderColor:m.color,backgroundColor:m.color+'14',tension:.3,pointRadius:0,borderWidth:2.5,fill:false,spanGaps:true}));
  const markerPlugin={id:'raceMarkers',
    beforeDatasetsDraw(chart){const{ctx,chartArea}=chart;const m0=chart.getDatasetMeta(0);ctx.save();
      if(m0&&m0.data.length>1){const fl=Math.floor(_raceStep),fr=_raceStep-fl;const i1=Math.min(fl,m0.data.length-1),i2=Math.min(fl+1,m0.data.length-1);const p1=m0.data[i1],p2=m0.data[i2];const clipX=p1.x+(i2>i1?(p2.x-p1.x)*fr:0);ctx.beginPath();ctx.rect(chartArea.left-4,chartArea.top-10,Math.max(0,clipX-chartArea.left+4),chartArea.height+20);ctx.clip();}else{ctx.beginPath();ctx.rect(0,0,0,0);ctx.clip();}},
    afterDatasetsDraw(chart){chart.ctx.restore();},
    afterDraw(chart){const{ctx,chartArea}=chart;const fl=Math.floor(_raceStep),fr=_raceStep-fl;const pts=[];
      chart.data.datasets.forEach((ds,di)=>{const mp=chart.getDatasetMeta(di).data;if(!mp.length)return;const i1=Math.min(fl,mp.length-1),i2=Math.min(fl+1,mp.length-1);const p1=mp[i1],p2=mp[i2];if(!p1)return;const lp=(a,b)=>a+(b-a)*(i2>i1?fr:0);const x=lp(p1.x,p2.x),y=lp(p1.y,p2.y);const v1=ds.data[i1],v2=ds.data[i2];const val=(v1!=null&&v2!=null&&i2>i1)?v1+(v2-v1)*fr:v1;if(val==null)return;pts.push({name:ds.label,x,y,color:ds.borderColor,val});});
      if(!pts.length)return;
      ctx.save();ctx.beginPath();ctx.moveTo(pts[0].x,chartArea.top);ctx.lineTo(pts[0].x,chartArea.bottom);ctx.strokeStyle='rgba(21,18,12,.14)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      const r=15;pts.sort((a,b)=>a.y-b.y);
      pts.forEach(pt=>{const img=_raceImgs[pt.name];ctx.save();ctx.beginPath();ctx.arc(pt.x,pt.y,r,0,Math.PI*2);if(img&&img.complete&&img.naturalWidth>0){ctx.closePath();ctx.clip();ctx.drawImage(img,pt.x-r,pt.y-r,r*2,r*2);ctx.restore();ctx.save();ctx.beginPath();ctx.arc(pt.x,pt.y,r,0,Math.PI*2);ctx.strokeStyle=pt.color;ctx.lineWidth=2.5;ctx.stroke();}else{ctx.fillStyle=pt.color;ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Archivo';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pt.name.charAt(0),pt.x,pt.y);}ctx.restore();});
      const ly=pts.map(pt=>pt.y),gap=14;for(let i=1;i<pts.length;i++){if(ly[i]-ly[i-1]<gap)ly[i]=ly[i-1]+gap;}
      pts.forEach((pt,i)=>{const ty=ly[i],tx=pt.x+r+6;if(Math.abs(ty-pt.y)>4){ctx.save();ctx.beginPath();ctx.moveTo(pt.x+r,pt.y);ctx.lineTo(tx-2,ty);ctx.strokeStyle=pt.color;ctx.globalAlpha=.35;ctx.lineWidth=1;ctx.stroke();ctx.restore();}ctx.save();ctx.fillStyle=pt.color;ctx.font='700 11px Archivo';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(pt.name+'  '+pt.val.toFixed(1)+'%',tx,ty);ctx.restore();});}
  };
  _raceChart=new Chart(el.getContext('2d'),{type:'line',data:{labels:s.labels,datasets},plugins:[markerPlugin],
    options:{responsive:true,maintainAspectRatio:false,animation:false,layout:{padding:{right:135}},
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{ticks:{color:'#6B6453',font:{size:10},autoSkip:false,maxRotation:0,callback:function(v){var l=this.getLabelForValue(v);return l.indexOf("'")>=0?(l.indexOf('Q1')===0?'20'+l.slice(-2):''):l;}},grid:{color:'rgba(21,18,12,.06)'},border:{display:false}},
              y:{ticks:{color:'#6B6453',font:{size:10},callback:v=>v.toFixed(0)+'%'},grid:{color:'rgba(21,18,12,.06)'},border:{display:false}}}}});
  _raceStep=s.labels.length-1;_raceChart.render();el.style.cursor='pointer';el.onclick=function(e){if(!_raceChart||!_raceChart.chartArea)return;var r=el.getBoundingClientRect(),ca=_raceChart.chartArea,x=e.clientX-r.left;var fr=Math.max(0,Math.min(1,(x-ca.left)/(ca.right-ca.left)));var target=Math.round(fr*(_raceSpec.labels.length-1));_animateTo(_raceStep,target,Math.max(350,Math.abs(target-_raceStep)*620/_raceSpeed));};
}

  const _lset={}; _losers.forEach(m=>{_lset[m]=1;});
  const _conf=!!(c.loser||(c.losers&&c.losers.length));
  const sav=(name)=>{const p=(DATA.photos||{})[name];const col=mc(name);return p?`<img src="${p}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none">`:`<div style="width:30px;height:30px;border-radius:50%;background:${col};color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;flex:none">${(name||'?').replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()}</div>`;};
  const _pill=(txt,extra)=>`<span style="margin-left:.5rem;font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;padding:.14rem .5rem;${extra}">${txt}</span>`;
  const _tagLast=_pill('laatste inzending','color:var(--muted);border:1px solid var(--line);border-radius:999px');
  const _tagLoser=()=>_pill('trakteert','color:#3a2a06;background:var(--gold);border-radius:999px');
  const _tagNotIn=(isL)=>isL?_pill('trakteert','color:#3a2a06;background:var(--gold);border-radius:4px'):_pill('nog niet ingevuld','color:var(--muted);border:1px solid var(--line);border-radius:4px');
  const _row=(num,member,isL,tag,ts)=>`<div class="dv-row${isL?' dv-last':''}"><span class="dv-rank">${num}</span>${sav(member)}<span class="dv-name">${member}${isL?' 🍺':''}${tag}</span><span class="dv-ts">${ts}</span></div>`;
  const _sts=st.slice().reverse();
  let orderHtml='';
  if(st.length||ny.length){
    _sts.forEach((sx,i)=>{const isL=!!_lset[sx.member];const lastSub=(i===_sts.length-1);orderHtml+=_row(i+1,sx.member,isL,isL?_tagLoser():(lastSub?_tagLast:''),_dvTs(sx.last_seen));});
    ny.forEach(m=>{const isL=!!_lset[m];orderHtml+=_row('—',m,isL,_tagNotIn(isL),'nog niet ingevuld');});
  } else { orderHtml='<div class="dv-empty">Nog geen inzendingen gedetecteerd.</div>'; }
  const tally=(d.tally_sorted||[]).filter(x=>x.count>0);
  let tallyHtml;
  if(tally.length){ tallyHtml=tally.map(x=>`<div class="dv-trow">${sav(x.member)}<span class="dv-name">${x.member}</span><span class="dv-beers">${'🍺'.repeat(x.count)}</span><span class="dv-cnt">${x.count}</span></div>`).join(''); }
  else if(_losers.length){ tallyHtml=_losers.map(n=>`<div class="dv-trow">${sav(n)}<span class="dv-name">${n}</span><span class="dv-beers">🍺</span><span class="dv-cnt">1</span></div>`).join(''); }
  else { tallyHtml='<div class="dv-empty">Nog geen schuld — dit is de allereerste ronde!</div>'; }
  const tag=shared?'delen samen de Duvels':'trakteert de Duvels';
  return `<section class="slide duvel" data-bg="dark"><div class="slide__inner">
    <div class="kicker">\ud83c\udf7a De Duvelcounter</div>
    <h2 class="dv-h">Wie vulde als <span class="u">laatste</span> in?</h2>
    <div class="dv-grid">
      <div class="dv-loser">${who.length?(shared?`<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">${who.map(n=>av(n,72)).join('')}</div>`:av(who[0])):''}<div class="dv-loser-name">${who.length?who.join(' & '):'\u2014'}</div><div class="dv-loser-tag">${tag}</div><div class="dv-rule">De laatste die zijn sheet invult v\u00f3\u00f3r de meeting, geeft een ronde Duvels. \ud83c\udf7a</div></div>
      <div class="dv-cols">
        <div class="dv-card"><div class="dv-cap">Inzendvolgorde \u2014 ${c.label||''}</div>${orderHtml}</div>
        <div class="dv-card"><div class="dv-cap">Duvelschuld \u2014 aller tijden</div>${tallyHtml}</div>
      </div>
    </div>
  </div></section>`;
}

const order=DATA.meta.active;
const SHOW_APP_INTRO=true;
const SHOW_WEDDING=true;   // one-off: aankondiging huwelijk Pieter — zet op false na Q2  // one-off app/dashboard intro (slide 2) \u2014 set false to hide next quarter
const manifest=[
  coverSlide,
  ...(SHOW_APP_INTRO?[appIntroSlide]:[]),
  ...(SHOW_WEDDING?[weddingTeaseSlide,weddingRevealSlide]:[]),
  duvelSlide,
  ()=>actSlide('I','<span class="u">Marktoverzicht</span>','Eerst de wereld waarin we reden: de gebeurtenissen die de beurzen dit kwartaal bewogen — en hoe de indices eruit kwamen.'),
  marketOverviewSlide,
  ()=>actSlide('II','Groep <span class="u">vs. markt</span>','Eén cijfer voor de hele club tegenover de markt. Wie wat deed, houden we nog even voor onszelf.'),
  transactionsSlide, groupVsMarketSlide,
  ()=>actSlide('III','De <span class="u">Kwartaalprijzen</span>','Het moment van de avond. De prijzen worden uitgereikt — één voor één onthuld, geen winnaar vooraf zichtbaar.'),
  prizesOverviewSlide,
  ()=>revealSlide('Strijdlust'),
  stocksSlide,
  camelHypeSlide,
  raceSlide,
  ()=>revealSlide('Etappeprijs'),
  ()=>revealSlide('Rode lantaarn'),
  ()=>revealSlide('Witte trui'),
  ()=>revealSlide('Gele trui'),
  rankingSlide,
  seasonSlide,
  troffeenkastSlide,
  lifetimeSlide,
  ()=>actSlide('IV','Individuele <span class="u">portfolios</span>','Negen portefeuilles, negen verhalen. Van etappewinnaar tot rode lantaarn.'),
  ...order.map(m=>()=>memberSlide(m)),
  ()=>actSlide('V','Woordje van de <span class="u">winnaars</span>','De microfoon gaat naar wie het verdiende.'),
  talkSlide, closingSlide,
];

const deck=document.getElementById('deck');
deck.innerHTML=manifest.map(b=>b()).join('');
const slides=[...document.querySelectorAll('.slide')];
const dots=document.getElementById('dots');
slides.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>go(i);dots.appendChild(b);});
const dotEls=[...dots.children];
let cur=0;

function onEnter(i){const s=slides[i];
  if(s.classList.contains('camel'))playSong();
  if(s.querySelector('.bfill')){s.querySelectorAll('.bfill').forEach(b=>b.style.width='0');setTimeout(()=>s.querySelectorAll('.bfill').forEach(b=>b.style.width=b.dataset.w+'%'),150);}
  if(s.classList.contains('rank')){s.querySelectorAll('.bar').forEach(b=>b.style.width='0');setTimeout(()=>s.querySelectorAll('.bar').forEach(b=>b.style.width=b.dataset.w+'%'),120);}
  if(s.classList.contains('reveal'))s.classList.remove('revealed');
  if(s.classList.contains('race')){replayRace();}
  if(s.classList.contains('member'))s.querySelectorAll('.hbar i').forEach(el=>{const w=el.style.width;el.style.width='0';setTimeout(()=>el.style.width=w,200);});
}
function doReveal(s){s.classList.add('revealed');if(_audioOn){sfxFanfare();setTimeout(sfxCheer,250);}const stat=s.querySelector('.revealStat');const val=parseFloat(s.dataset.val);const dec=parseInt(s.dataset.dec);if(stat)setTimeout(()=>countUp(stat,val*100,1100,'%',dec),350);}
function go(i){i=Math.max(0,Math.min(slides.length-1,i));slides[cur].classList.remove('is-active');cur=i;const s=slides[cur];s.classList.add('is-active');document.body.classList.toggle('darkchrome',s.dataset.bg==='dark');dotEls.forEach((d,k)=>d.classList.toggle('on',k===cur));document.getElementById('counter').textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');s.querySelectorAll('.reveal-up,.evt').forEach(el=>{el.style.animation='none';el.offsetHeight;el.style.animation='';});onEnter(cur);}
function next(){ac();const s=slides[cur];if(s.dataset.step==='1'&&!s.classList.contains('revealed')){doReveal(s);return;}go(cur+1);}
function prev(){ac();go(cur-1);}
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev();}else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(slides.length-1);}});
document.addEventListener('click',e=>{if(e.target.closest('.dot')||e.target.closest('.racectrl')||e.target.tagName==='CANVAS'||e.target.closest('.audiobtn'))return;const y=e.clientY/window.innerHeight;if(y>0.8){e.clientX/window.innerWidth<0.5?prev():next();}});
try{document.title="Kwartaalmeeting · "+DATA.meta.quarter+" "+DATA.meta.year;}catch(e){}
initCharts();
go(0);
</script>
</body>
</html>
